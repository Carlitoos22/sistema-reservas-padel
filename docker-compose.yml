services:
  postgres:
    image: postgres:16
    container_name: padel_postgres
    environment:
      POSTGRES_USER: padel_user
      POSTGRES_PASSWORD: padel_pass
      POSTGRES_DB: padel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: padel_redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: padel_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data: