services:
  postgres:
    image: postgres:16
    container_name: padel_postgres
    environment:
      POSTGRES_USER: padel_user
      POSTGRES_PASSWORD: padel_pass
      POSTGRES_DB: padel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: