{% extends "base.html" %}
{% block titulo %}Registrarse{% endblock %}

{% block contenido %}
<div class="tarjeta tarjeta-form">
    <h1>Crear cuenta</h1>
    {% if error %}<p class="alerta">{{ error }}</p>{% endif %}
    <form method="post" action="/registro">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required autofocus>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>
        <button type="submit" class="btn btn-primario btn-ancho">Crear cuenta</button>
    </form>
    <p class="texto-suave">¿Ya tenés cuenta? <a href="/login">Iniciá sesión</a>.</p>
</div>
{% endblock %}
